<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratchet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui.css">
<meta name="theme-color" content="#ffffff">
<script>
// Inline and before first paint on purpose: loading the theme from a module at
// the end of <body> would flash a white page at dark-mode users on every load.
(function () {
  // One-time carry-over of this device's stored settings from the project's
  // old name. Without it every device would forget its passkey, library,
  // theme and open sections at once. Runs here rather than in a module
  // because the theme read below is the first thing that needs the new keys.
  try {
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var old = localStorage.key(i);
      if (!old || old.indexOf("ficsync_") !== 0) continue;
      var renamed = "ratchet_" + old.slice("ficsync_".length);
      if (localStorage.getItem(renamed) === null)
        localStorage.setItem(renamed, localStorage.getItem(old));
      localStorage.removeItem(old);
    }
  } catch (e) { /* private mode: nothing to carry over anyway */ }
  try {
    var stored = localStorage.getItem("ratchet_theme");
    var dark = stored === "dark" || (stored !== "light" &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) { /* private mode: fall through to the light default */ }
})();
</script>
</head>
<body>
<header>
  <h1><a id="apkLink" href="/apk" title="Download the latest Ratchet app"><img src="logo-light.png" alt="Ratchet" class="logo"></a></h1>
  <select id="librarySelect" aria-label="library" disabled>
    <!-- Replaced once /libraries answers; until then (and on the token
         screen, which never gets that far) this is what shows. -->
    <option value="">Library</option>
  </select>
  <div class="controls">
    <button class="small icon" id="btnTheme" aria-pressed="false"></button>
    <button class="small icon" id="btnMute" aria-pressed="false"></button>
    <button class="small icon" id="btnSettings" title="token">&#9881;</button>
  </div>
</header>
<main>
  <div id="storageBanner" class="err" hidden>
    <span id="storageBannerText"></span>
    <button class="small" id="btnGrantStorage">Grant access</button>
  </div>
  <div id="errBox" class="err" hidden></div>

  <!-- token setup -->
  <section id="vToken" hidden>
    <p>Enter your Ratchet passkey.</p>
    <div class="row"><input type="text" id="tokenInput" placeholder="token">
    <button class="primary" id="btnSaveToken">Login</button></div>
  </section>

  <!-- browse -->
  <section id="vBrowse" hidden>
    <div class="row filterbar">
      <button type="button" class="small" id="btnToggleFilters"
              aria-expanded="true" aria-controls="filterChips">&#9662; Filters</button>
      <select id="savedFilters" class="small" aria-label="saved filter sets">
        <option value="">Saved&hellip;</option>
      </select>
      <button type="button" class="small" id="btnSaveFilters" disabled>Save</button>
      <button type="button" class="small" id="btnDeleteFilters" hidden>Delete</button>
    </div>
    <div id="filterChips" hidden></div>
    <form id="searchForm" class="row">
      <button type="button" id="btnAddFilter" class="icon"
              title="add filter" aria-label="add filter">&#9776;</button>
      <input type="search" id="q" placeholder="search (calibre syntax works)">
      <button class="primary">Go</button>
    </form>
    <div class="row sortrow">
      <label class="small muted" for="sortSelect">Sort</label>
      <select id="sortSelect" aria-label="sort order"></select>
      <button type="button" class="small icon" id="btnSortDir"
              title="sort direction" aria-label="sort direction">&#8595;</button>
      <button type="button" class="small" id="btnAddStory"
              title="add a story to this library by URL">+ Add</button>
    </div>
    <div id="addStatus" class="small muted" hidden></div>
    <div id="queryPreview" class="small muted"></div>
    <ol id="results" class="list"></ol>
    <button id="btnMore" class="small" hidden>more</button>
  </section>

  <!-- filter column picker -->
  <section id="vPickCol" hidden>
    <button class="small" data-nav="browse">&larr; back</button>
    <h2>Filter on which column?</h2>
    <ul id="colList" class="list"></ul>
  </section>

  <!-- filter value picker -->
  <section id="vPickVal" hidden>
    <button class="small" data-nav="browse">&larr; cancel</button>
    <h2 id="pickValTitle"></h2>
    <div class="row">
      <div class="tabs" role="tablist" aria-label="include or exclude">
        <button type="button" class="tab on" role="tab" id="tabInclude"
                data-mode="include" aria-selected="true"
                title="match this value">Is</button>
        <button type="button" class="tab" role="tab" id="tabExclude"
                data-mode="exclude" aria-selected="false"
                title="exclude this value">Not</button>
      </div>
      <input type="text" id="freeValue" placeholder="or type a value">
      <button class="small" id="btnFreeValue">use</button>
    </div>
    <div id="valTree"></div>
  </section>

  <!-- book detail -->
  <section id="vDetail" hidden>
    <button class="small" data-nav="browse">&larr; back</button>
    <div class="bookhead">
      <img id="dCover" alt="" hidden>
      <div class="bookhead-text">
        <h2><span id="dTitle"></span><button type="button" id="btnEditTitle"
            class="editicon" title="edit title" aria-label="edit title"
            hidden>&#9998;</button></h2>
        <div id="dSeries" class="series" hidden></div>
        <div id="dAuthors" class="muted"></div>
      </div>
    </div>
    <div id="dFields"></div>
    <div class="row actions">
      <button id="btnCheck" hidden>Check</button>
      <button id="btnUpdate" hidden>Update</button>
      <button id="btnConvert" hidden
              title="replace with a fresh FanFicFare download">Convert</button>
      <button id="btnEpub" title="download the epub">Get</button>
      <button id="btnRead" class="primary" hidden>Read</button>
    </div>
    <div id="busy" class="box" hidden></div>
    <div id="decision" hidden></div>
    <div id="dEvents"></div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>

[service]
# Where Ratchet listens, which decides how your phone reaches it:
#   "127.0.0.1"  this machine only, with Tailscale handing it the tailnet's
#                traffic (`tailscale serve`; Setup.bat turns that on). Nothing
#                needs the firewall opened, so nothing needs administrator
#                rights. The default, and what the setup wizard writes.
#   "tailscale"  this machine's tailnet address itself, looked up at startup
#                (an IP can change; a literal would go stale). About 10 ms a
#                request quicker, because Tailscale is not in the middle —
#                but Windows Firewall then has to be told to allow it, by an
#                administrator. The README has the one command.
# Also accepts a literal IP, or "0.0.0.0" for every interface, LAN included
# (not recommended).
host = "127.0.0.1"
port = 8484
auth_token = ""            # set in .env: RATCHET_AUTH_TOKEN=<long random string>
# data_dir: where the sidecar DB and pre-update backups live. Default if omitted:
#   Windows: %LOCALAPPDATA%\Ratchet      elsewhere: ~/.local/share/ratchet
# Windows TOML note: use forward slashes ("C:/ratchet-data") or a single-quoted
# literal string ('C:\ratchet-data') — backslashes in "double quotes" are escapes.
#data_dir = "C:/ratchet-data"
backups_keep = 5           # pre-update epub backups kept per book

[calibre]
base_url = "http://127.0.0.1:8080"
library_id = ""            # empty = server's default library; else the id from
                           # /ajax/library-info (usually the library folder name)
username = ""              # if your content server requires auth; prefer putting
password = ""              # these in a .env file next to config.toml instead:
                           # RATCHET_CALIBRE_USERNAME= / RATCHET_CALIBRE_PASSWORD=
                           # (RATCHET_AUTH_TOKEN= works there too; real env vars win)
identifier_key = "url"     # where the FFF plugin stores story URLs (fallback only;
                           # the epub's dc:source is used first)
genre_field = "#genre"     # custom column shown beside tags in the book list
                           # ("" to show none)
fandom_field = "#fandom"   # the other two columns this library files under.
majchar_field = "#majchar" # A tag rule can move a tag into any of the three,
                           # and the maintenance scripts read and write them.
row_field = ""             # custom column shown at the right of the title line

# Where "this book's content last arrived" is recorded, which the Last Updated
# sort reads. calibre's Date is when a book was ADDED and nothing moves it
# afterwards — not a metadata edit, not replacing the epub with new chapters —
# so on its own it cannot say what got new chapters recently.
#   ""             record nothing; the sort falls back to Date. No book is
#                  written to, and no column is needed.
#   "#lastupdate"  a datetime column you add yourself (calibre: Preferences →
#                  Add your own columns, type Date). Keeps Date meaning
#                  date-added. Books with no value yet sort as one block,
#                  because calibre sorts server-side and cannot fall back per
#                  book — so seed it from Date if you want an exact order.
#   "timestamp"    overwrite calibre's own Date. No column needed and exact at
#                  once, but date-added is then gone for good.
lastupdate_field = ""
                           # in the book list, for books with no series — which
                           # is what otherwise sits there. A library without the
                           # column just shows nothing. e.g. "#fandom"
writable_fields = ["title", "tags", "rating", "#*"]   # fnmatch patterns for POST /fields
                           # this is the permission boundary — the endpoint
                           # refuses to write anything not matching
editable_fields = []       # which fields the book page shows, in the order
                           # shown. Exact lookup names, not patterns.
                           # [] = every writable text/enumeration column, with
                           # fandom/genre/tags/reading list first and the
                           # description last. Listing a field here does not
                           # grant permission to write it; it still has to
                           # pass writable_fields above. "comments" is the
                           # read-only description — include it to place it,
                           # leave it out of a configured list to hide it. e.g.
                           # ["#fandom", "#majchar", "#genre", "tags", "comments", "#readinglist"]

[fanficfare]
binary = "fanficfare"      # leave as-is: if not on PATH (unactivated venv), Ratchet
                           # falls back to running FFF inside its own interpreter
config_file = ""           # optional: path to a personal.ini (passed with -c)
extra_options = []         # e.g. ["-o", "is_adult=true"]
non_append_updates = "allow"   # "refuse" to require manual handling of
                               # mid-list insertions/reorders
timeout_seconds = 1800
blocked_sites = []          # site tags refused temporarily, e.g. ["archiveofourown.org"]
include_images = "true"     # "true", "coveronly" or "false"; applies to epub downloads only

[politeness]
min_seconds_between_site_requests = 5.0

# Only the maintenance scripts in .scripts/ read this section; the service
# ignores it. Each names a calibre custom column, and a script whose column
# is blank says so and does nothing rather than guessing at another.
[scripts]
downloaded_field = "#downloaded"  # boolean: FanFicFare can update this book
# Top-level tag names your own scheme owns. A tag under any other root is
# taken to have come from a source site, which is what stray_tags.py sorts
# out; leave it empty and that script stops rather than calling everything
# stray. e.g. ["Tropes", "Content", "Format", "Key Events"]
scheme_roots = []
# Roots under which a book holds one value at a time, e.g. ["Serial"] — a
# story is ongoing or finished, not both. Anywhere else a second value is
# just another true thing (a book can be Trope.Progression and
# Trope.Reincarnation at once), so this cannot be inferred from the tags.
# refresh_site_tags.py reports a disagreement here instead of picking a side.
exclusive_roots = []

# What becomes of the tags a story arrives wearing. The rules themselves are a
# file, not a table here: there are hundreds in a working library and the
# scripts rewrite it for you to edit. Blank means config/tag_rules.txt.
[tags]
rules_file = ""
